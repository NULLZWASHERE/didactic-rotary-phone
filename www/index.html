<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <title>Dandys world • Dark Overdose [BETA]</title>
        <style>
            html, body {
                margin: 0; padding: 0; background-color: black; overflow: hidden;
                touch-action: none; user-select: none; -webkit-user-select: none;
            }
            #mobile-pad {
                position: fixed; bottom: 16px; left: 0; right: 0;
                display: flex; justify-content: space-between; align-items: flex-end;
                padding: 0 20px; pointer-events: none; z-index: 99999;
            }
            .dpad { display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); gap: 6px; pointer-events: auto; }
            .actions { display: flex; gap: 12px; align-items: center; pointer-events: auto; }
            .rm-btn {
                background: rgba(255, 255, 255, 0.2); border: 2px solid rgba(255, 255, 255, 0.45);
                border-radius: 14px; color: #fff; font-family: sans-serif; font-weight: bold; font-size: 16px;
                display: flex; align-items: center; justify-content: center; backdrop-filter: blur(2px);
            }
            .action-btn { width: 60px; height: 60px; border-radius: 50%; }
            .rm-btn.pressed { background: rgba(255, 255, 255, 0.55); }
        </style>
    </head>
    <body style="background-color: black">
        <!-- Standard RPG Maker MV JS imports omitted for brevity; see full template in source document -->
        <div id="mobile-pad">
            <div class="dpad">
                <div></div><div class="rm-btn" data-key="ArrowUp" data-code="ArrowUp" data-keycode="38">▲</div><div></div>
                <div class="rm-btn" data-key="ArrowLeft" data-code="ArrowLeft" data-keycode="37">◀</div><div></div><div class="rm-btn" data-key="ArrowRight" data-code="ArrowRight" data-keycode="39">▶</div>
                <div></div><div class="rm-btn" data-key="ArrowDown" data-code="ArrowDown" data-keycode="40">▼</div><div></div>
            </div>
            <div class="actions">
                <div class="rm-btn action-btn" data-key="Shift" data-code="ShiftLeft" data-keycode="16">RUN</div>
                <div class="rm-btn action-btn" data-key="x" data-code="KeyX" data-keycode="88">X</div>
                <div class="rm-btn action-btn" data-key="z" data-code="KeyZ" data-keycode="90">Z</div>
            </div>
        </div>
        <script>
            function fireRMMVKey(type, btn) {
                var codeNum = parseInt(btn.getAttribute('data-keycode'), 10);
                var ev = new KeyboardEvent(type, { key: btn.getAttribute('data-key'), code: btn.getAttribute('data-code'), keyCode: codeNum, which: codeNum, bubbles: true, cancelable: true });
                Object.defineProperty(ev, 'keyCode', { get: function() { return codeNum; } });
                Object.defineProperty(ev, 'which', { get: function() { return codeNum; } });
                document.dispatchEvent(ev); window.dispatchEvent(ev);
            }
            document.querySelectorAll('.rm-btn').forEach(function(btn) {
                ['touchstart', 'touchend', 'touchcancel'].forEach(function(evt) {
                    btn.addEventListener(evt, function(e) {
                        e.preventDefault(); e.stopPropagation();
                        if (evt === 'touchstart') { btn.classList.add('pressed'); fireRMMVKey('keydown', btn); }
                        else { btn.classList.remove('pressed'); fireRMMVKey('keyup', btn); }
                    }, { passive: false });
                });
            });
        </script>
    </body>
</html>
